<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cairn 知识图谱</title>
<style>
:root{
  color-scheme:light;
  --surface:#fcfcfb; --panel:#ffffff; --line:rgba(0,0,0,.10);
  --ink:#1a1a19; --ink-2:#5e5d59; --ink-3:#8a8880;
  --graph-node-1:#2a78d6; --graph-node-2:#eb6834; --graph-node-3:#1baf7a; --graph-node-4:#8a8880;
  --graph-line:rgba(0,0,0,.24); --graph-line-bridge:#5e5d59;
  --graph-node-unresolved:#a8a69c; --graph-node-focused:#1a1a19;
  --graph-text:#5e5d59;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark;
  --surface:#1a1a19; --panel:#232322; --line:rgba(255,255,255,.14);
  --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8a8880;
  --graph-node-1:#3987e5; --graph-node-2:#d95926; --graph-node-3:#199e70; --graph-node-4:#8a8880;
  --graph-line:rgba(255,255,255,.28); --graph-line-bridge:#c3c2b7;
  --graph-node-unresolved:#6b6a63; --graph-node-focused:#ffffff;
  --graph-text:#c3c2b7;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface:#1a1a19; --panel:#232322; --line:rgba(255,255,255,.14);
  --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8a8880;
  --graph-node-1:#3987e5; --graph-node-2:#d95926; --graph-node-3:#199e70; --graph-node-4:#8a8880;
  --graph-line:rgba(255,255,255,.28); --graph-line-bridge:#c3c2b7;
  --graph-node-unresolved:#6b6a63; --graph-node-focused:#ffffff;
  --graph-text:#c3c2b7;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--surface);color:var(--ink);overflow:hidden;
  font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif}
canvas{display:block;cursor:grab}
canvas.drag{cursor:grabbing}

.bar{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;gap:10px;align-items:center;
  padding:10px 14px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar h1{margin:0;font-size:14px;font-weight:650;letter-spacing:.01em}
.bar .sub{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.bar .sp{flex:1}
input,button{font:inherit;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:7px;padding:5px 10px}
input{width:190px}
input::placeholder{color:var(--ink-3)}
button{cursor:pointer}
button:hover{border-color:var(--ink-3)}

.legend{position:fixed;left:14px;bottom:14px;z-index:3;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;
  max-width:270px}
.legend .row{display:flex;align-items:center;gap:8px;margin:4px 0}
.legend .dot{width:10px;height:10px;border-radius:50%;flex:none}
.legend .ring{width:12px;height:12px;border-radius:50%;flex:none;
  border:1.2px solid var(--graph-node-1);background:transparent;opacity:.75}
.legend .seg{width:22px;height:0;flex:none;border-top:2px dashed var(--graph-line-bridge)}
.legend .n{color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums}
.legend hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.legend .note{color:var(--ink-3);line-height:1.45}

.panel{position:fixed;top:52px;right:14px;bottom:14px;width:330px;z-index:3;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel[hidden]{display:none!important}
.panel h2{margin:0 0 2px;font-size:15px;line-height:1.35;word-break:break-all}
.panel .meta{color:var(--ink-3);font-size:12px;margin-bottom:12px;font-variant-numeric:tabular-nums}
.panel h3{margin:16px 0 5px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);font-weight:650}
.panel p{margin:0;color:var(--ink-2)}
.panel .hook{color:var(--ink)}
.panel ul{margin:0;padding-left:17px;color:var(--ink-2)}
.panel li{margin:3px 0;word-break:break-word}
.panel .tags{display:flex;flex-wrap:wrap;gap:5px}
.panel .tag{font-size:11px;padding:2px 7px;border:1px solid var(--line);border-radius:20px;
  color:var(--ink-2)}
.panel .lnk{color:var(--ink);cursor:pointer;text-decoration:underline;
  text-underline-offset:2px;text-decoration-color:var(--ink-3)}
.panel .close{position:absolute;top:10px;right:12px;padding:2px 8px;font-size:13px}
.hint{position:fixed;right:14px;bottom:14px;z-index:2;color:var(--ink-3);font-size:12px;
  transition:opacity 1.2s}
@media (max-width:900px){ .panel{width:auto;left:14px} }
</style></head><body>

<div class="bar">
  <h1>Cairn 知识图谱</h1><span class="sub" id="sub"></span>
  <span class="sp"></span>
  <input id="q" placeholder="搜索片段 / 概念…" autocomplete="off">
  <button id="fit">重置视图</button>
  <button id="theme">明暗</button>
</div>
<canvas id="c"></canvas>
<div class="legend" id="legend"></div>
<aside class="panel" id="panel" hidden></aside>
<div class="hint" id="hint">滚轮缩放 · 拖拽平移 · 点节点看详情</div>

<script>
const DATA = /*__DATA__*/;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = DATA.nodes, E = DATA.edges;
const byId = Object.fromEntries(N.map(n => [n.id, n]));
E.forEach(e => { e.S = byId[e.s]; e.T = byId[e.t]; });

const nbr = {};
N.forEach(n => { nbr[n.id] = new Set(); });
E.forEach(e => { nbr[e.s].add(e.t); nbr[e.t].add(e.s); });

document.getElementById('sub').textContent =
  DATA.repo + ' · ' + N.filter(n => !n.ghost).length + ' 个片段 · ' + E.length + ' 条链接 · '
  + E.filter(e => e.bridge && !e.ghost).length + ' 条跨簇的桥'
  + (N.some(n => n.ghost) ? ' · ' + N.filter(n => n.ghost).length + ' 个还没写' : '');

/* ---------- 布局 ----------
   简单的 Fruchterman–Reingold。节点数是几十量级，O(n²) 斥力足够；
   上 Barnes–Hut 属于为不存在的规模做优化。 */
const R = Math.max(200, Math.sqrt(N.length) * 58);   // 自然边长。太大时 120 个节点会摊到 4000 单位宽
const MAXDEG = Math.max(1, ...N.map(n => n.deg));
N.forEach((n, i) => {
  const a = i * 2.399963;                 // 黄金角散布，避免初始对称造成的死锁
  const rad = R * 0.5 * Math.sqrt(i / N.length + 0.15);
  n.x = Math.cos(a) * rad; n.y = Math.sin(a) * rad;
  n.vx = 0; n.vy = 0;
  // 尺寸按本图自己的最高度数归一，这样无论图多大都吃满整个范围。
  // 固定上限会让大图里所有节点看起来一样大，层次就没了。
  n.r = (n.ghost ? 3 : 4) + 10 * Math.sqrt(n.deg / MAXDEG);
  n.ph = (i * 2.399963) % 6.2832;         // 游走相位
  n.a = 1;                                // 当前透明度，用于平滑过渡
});
const K = R / Math.sqrt(Math.max(N.length, 2));
// 向心系数必须随 N 变：外圈节点受到的是**所有** N 个节点的斥力，
// 总量 ~1.15·N·K³/d²。要让半径落在 K·√N·0.8（面积正比于 N 才不会挤），
// 解出 CENTER = 1.15N / (0.8³·N^1.5) = 2.25/√N。
// 之前写死 1.15/27 等于忽略了 N，120 个节点就摊到 4275 单位宽，
// fit() 撞上缩放下限，整张图溢出屏幕。
const CENTER = 2.25 / Math.sqrt(N.length);
// 边的透明度是边数的函数，不是常数。几条边时要看得清，上千条时必须退成背景纹理，
// 否则整张图糊成一团灰雾（Obsidian 在 400 节点规模下边几乎是背景色）。
const EDGE_A = Math.max(0.14, Math.min(0.55, 3.2 / Math.sqrt(E.length + 8)));
const IDLE = 0.32;          // 极小的游走力：完全静止的图看起来是死的
let tick = 0;
let heat = 1, dragging = null, avgSpeed = 99;

function step() {
  for (const n of N) { n.fx = 0; n.fy = 0; }
  for (let i = 0; i < N.length; i++) {
    for (let j = i + 1; j < N.length; j++) {
      const a = N[i], b = N[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d2 = dx * dx + dy * dy || 0.01, d = Math.sqrt(d2);
      const f = (K * K) / d2 * 1.15, ux = dx / d, uy = dy / d;
      a.fx += ux * f * K; a.fy += uy * f * K;
      b.fx -= ux * f * K; b.fy -= uy * f * K;
    }
  }
  for (const e of E) {
    const a = e.S, b = e.T;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01;
    const f = (d * d) / K * 0.0034, ux = dx / d, uy = dy / d;   // 加强：太弱会摊成网格
    a.fx += ux * f; a.fy += uy * f; b.fx -= ux * f; b.fy -= uy * f;
  }
  // 同簇之间一点弱吸引，让板块在空间上聚成团——这正是图比索引多出来的那层信息
  const cen = centroids();
  for (const n of N) {
    const c = cen[n.cluster];
    n.fx += (c.x - n.x) * 0.012; n.fy += (c.y - n.y) * 0.012;
    // 向心力。互不相连的簇之间只有斥力，向心太弱它们会飞到极远：
    // 斥力约 1.15·K³/d²，取 c 使平衡点落在 ~3K（d³ = 1.15·K³/c）。
    // 之前 c=0.0022 对应 d≈8K，包围盒被撑爆，fit 算出的 scale 掉到标签阈值以下。
    n.fx -= n.x * CENTER; n.fy -= n.y * CENTER;
    // 游走：每个节点一个相位，合起来是缓慢的有机漂动，不破坏布局
    n.fx += Math.sin(tick * 0.0016 + n.ph) * IDLE;
    n.fy += Math.cos(tick * 0.0021 + n.ph * 1.7) * IDLE;
  }
  for (const n of N) {
    if (n === dragging) continue;
    n.vx = (n.vx + n.fx) * 0.82; n.vy = (n.vy + n.fy) * 0.82;
    const sp = Math.hypot(n.vx, n.vy), cap = 26 * heat;
    if (sp > cap) { n.vx = n.vx / sp * cap; n.vy = n.vy / sp * cap; }
    n.x += n.vx; n.y += n.vy;
  }
  tick++;
  heat = Math.max(0.06, heat * 0.994);
  // 收敛判据用真实速度，不用热量：热量是时间的函数，大图还在铺开时
  // 它就已经降到阈值，自动取景会提前停，导致图溢出屏幕。
  let v = 0;
  for (const n of N) v += Math.hypot(n.vx, n.vy);
  avgSpeed = v / N.length;
}
function centroids() {
  const c = {};
  for (const n of N) {
    if (!c[n.cluster]) c[n.cluster] = { x: 0, y: 0, k: 0, slot: n.slot };
    c[n.cluster].x += n.x; c[n.cluster].y += n.y; c[n.cluster].k++;
  }
  for (const k in c) { c[k].x /= c[k].k; c[k].y /= c[k].k; }
  return c;
}

/* ---------- 视图 ---------- */
let scale = 1, ox = 0, oy = 0, W = 0, H = 0;
function resize() {
  const d = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
function fitTarget() {
  const xs = N.map(n => n.x), ys = N.map(n => n.y);
  const minx = Math.min(...xs), maxx = Math.max(...xs);
  const miny = Math.min(...ys), maxy = Math.max(...ys);
  // 留出节点半径、节点标签和簇名标签的空间，否则边缘的节点会被切掉
  const w = maxx - minx + 260, h = maxy - miny + 190;
  // 面板没开就用整个宽度——无条件预留面板宽度会让右侧空一大片
  const panelOpen = !panel.hidden && W > 900;
  const left = 24, right = panelOpen ? 372 : 24;
  const top = 64, bottom = 34;
  const availW = Math.max(240, W - left - right);
  const availH = Math.max(240, H - top - bottom);
  const s = Math.max(0.06, Math.min(1.8, Math.min(availW / w, availH / h)));
  return { s,
    ox: left + availW / 2 - (minx + maxx) / 2 * s,
    oy: top + availH / 2 - (miny + maxy) / 2 * s };
}
// 取景持续平滑跟随，不用「收敛了就锁死」那套：布局在判定收敛之后
// 往往还在缓慢收缩，锁死的框会过期——表现为图缩成一小团或溢出屏幕。
// 平滑跟随永远不会过期，而且游走造成的微小偏差被缓动吸收掉，不会抖。
function fit(smooth) {
  const t = fitTarget();
  if (smooth) {
    scale += (t.s - scale) * 0.07;
    ox += (t.ox - ox) * 0.07;
    oy += (t.oy - oy) * 0.07;
  } else {
    scale = t.s; ox = t.ox; oy = t.oy;
  }
}
const sx = n => n.x * scale + ox;
const sy = n => n.y * scale + oy;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

let hover = null, picked = null, query = '', userMoved = false;
// 字号有下限，绝不跟着缩放缩到不可读——标签的可读性不该取决于缩放层级。
// 显不显示则看**屏幕空间密度**，不看缩放层级：缩放只是间接指标，
// 真正决定标签会不会糊成一片的是「每个节点在屏幕上分到多少地方」。
const LABEL_PX = 11;
const LABEL_MIN_ROOM = 72;      // 每节点的屏幕边长小于这个就藏起来
function labelsVisible() {
  const xs = N.map(n => n.x), ys = N.map(n => n.y);
  const w = (Math.max(...xs) - Math.min(...xs)) * scale;
  const h = (Math.max(...ys) - Math.min(...ys)) * scale;
  return Math.sqrt(Math.max(w * h, 1) / N.length) > LABEL_MIN_ROOM;
}
const LABEL_MAX_CHARS = 24;     // 长 slug 会压到邻居；全名在详情面板里
function shortLabel(id) {
  return id.length > LABEL_MAX_CHARS ? id.slice(0, LABEL_MAX_CHARS - 1) + '…' : id;
}
function matches(n) {
  const q = query.toLowerCase();
  if (!q) return true;
  return n.id.toLowerCase().indexOf(q) >= 0
      || (n.hook || '').toLowerCase().indexOf(q) >= 0
      || n.cluster.toLowerCase().indexOf(q) >= 0
      || n.concepts.some(c => String(c).toLowerCase().indexOf(q) >= 0);
}
function lit(n) {
  if (query) return matches(n);
  const f = hover || picked;
  if (!f) return true;
  return n.id === f.id || nbr[f.id].has(n.id);
}

function draw() {
  const SC = [css('--graph-node-1'), css('--graph-node-2'), css('--graph-node-3'), css('--graph-node-4')];
  const INK = css('--ink'), INK2 = css('--ink-2'), INK3 = css('--ink-3');
  const focus = hover || picked;
  const roomy = labelsVisible();
  ctx.clearRect(0, 0, W, H);

  for (const e of E) {
    const on = lit(e.S) && lit(e.T);
    // 目标透明度平滑逼近，不硬切——hover 的明暗变化是这类图「顺眼」的一半原因
    const target = on ? (e.bridge ? 1 : 0.78) : 0.12;
    e.a = e.a === undefined ? target : e.a + (target - e.a) * 0.16;
    ctx.save();
    ctx.globalAlpha = EDGE_A * e.a * (e.bridge ? (roomy ? 2.1 : 1.5) : 1);
    ctx.strokeStyle = e.bridge ? css('--graph-line-bridge') : css('--graph-line');
    ctx.lineWidth = (e.bridge ? 1.6 : 1.1) * (e.mutual ? 1.6 : 1);
    if (e.bridge) ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(sx(e.S), sy(e.S)); ctx.lineTo(sx(e.T), sy(e.T));
    ctx.stroke(); ctx.restore();
  }

  // 簇名压在簇的包围盒上沿，不是质心减一个固定偏移——簇一拉长，
  // 固定偏移就会把标签丢进簇内部，正好压在节点和连线上。
  const box = {};
  for (const n of N) {
    if (n.ghost) continue;          // 幽灵不算进簇的包围盒，否则簇名会被拽跑
    const b = box[n.cluster] ||= { x0: 1e9, x1: -1e9, y0: 1e9, k: 0 };
    b.x0 = Math.min(b.x0, n.x); b.x1 = Math.max(b.x1, n.x);
    b.y0 = Math.min(b.y0, n.y); b.k++;
  }
  ctx.textAlign = 'center';
  ctx.font = '600 12px system-ui,sans-serif';
  // 簇交错时标签会撞在一起。按屏幕 y 排好，逐个往上顶开——
  // 撞成一团的标签比没有标签更糟，因为读者分不清哪个名字属于哪个簇。
  const marks = [];
  for (const name in box) {
    const b = box[name];
    if (b.k < 2) continue;
    marks.push({ name,
      x: (b.x0 + b.x1) / 2 * scale + ox,
      y: b.y0 * scale + oy - 22,
      w: ctx.measureText(name).width });
  }
  marks.sort((a, b) => a.y - b.y);
  for (let i = 1; i < marks.length; i++) {
    for (let j = 0; j < i; j++) {
      const a = marks[j], b = marks[i];
      if (Math.abs(a.x - b.x) < (a.w + b.w) / 2 + 12 && Math.abs(a.y - b.y) < 17) {
        b.y = a.y - 17;                 // 往上顶开一行
        j = -1;                          // 顶开之后要和前面所有的重新比
      }
    }
  }
  for (const m of marks) {
    ctx.save();
    ctx.globalAlpha = (hover || picked || query) ? 0.3 : 0.8;
    ctx.fillStyle = INK3;
    ctx.font = '600 12px system-ui,sans-serif';
    ctx.textBaseline = 'bottom';
    ctx.fillText(m.name, m.x, m.y);
    ctx.restore();
  }

  for (const n of N) {
    const x = sx(n), y = sy(n);
    const r = (n.ghost ? n.r * 0.72 : n.r) * Math.max(0.7, Math.min(1.4, scale));
    const on = lit(n);
    const target = on ? (n.ghost ? 0.55 : 1) : 0.14;
    n.a += (target - n.a) * 0.16;            // 平滑逼近，不硬切
    ctx.save(); ctx.globalAlpha = n.a;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832);
    // 幽灵＝被链接但还不存在的片段。用淡填充而不是空心虚线圈：
    // 密集时 4px 的虚线圈会直接消失，淡填充在任何尺度下都还在。
    ctx.fillStyle = n.ghost ? css('--graph-node-unresolved') : SC[n.slot];
    ctx.fill();
    // 未解决问题：细环，用节点自己的颜色而不是纯黑/纯白——
    // 高对比的环在满屏节点时会变成噪声，抢走本该属于结构的注意力。
    // 计数只在放大或聚焦时出现（detail on demand）。
    if (n.open.length && (roomy || (focus && (focus.id === n.id || nbr[focus.id].has(n.id))))) {
      ctx.beginPath(); ctx.arc(x, y, r + 3.5, 0, 6.2832);
      ctx.strokeStyle = SC[n.slot]; ctx.lineWidth = 1.2;
      ctx.globalAlpha = n.a * 0.75; ctx.stroke();
      if (scale > 0.8 || (focus && focus.id === n.id)) {
        ctx.globalAlpha = n.a * 0.9;
        ctx.fillStyle = css('--graph-text'); ctx.font = '600 10px system-ui,sans-serif';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(n.open.length), x, y - r - 9);
      }
      ctx.globalAlpha = n.a;
    }
    if (picked && picked.id === n.id) {
      ctx.beginPath(); ctx.arc(x, y, r + 8, 0, 6.2832);
      ctx.strokeStyle = css('--graph-node-focused'); ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    ctx.restore();

    // 标签：缩得太小就不画——读不了的标签只是噪声，而且几十个节点时会糊成一片。
    // 但当前关注的节点和它的邻居永远带标签（detail on demand）。
    const near = focus && (n.id === focus.id || nbr[focus.id].has(n.id));
    if (!roomy && !near && !query) continue;
    const fs = Math.round(LABEL_PX * Math.max(1, Math.min(1.3, scale)));
    ctx.save(); ctx.globalAlpha = n.a * (n.ghost ? 0.72 : 0.95);
    ctx.fillStyle = css('--graph-text');
    ctx.font = (n.ghost ? 'italic ' : '') + fs + 'px system-ui,sans-serif';
    ctx.textBaseline = 'top';
    ctx.fillText(shortLabel(n.id), x, y + r + 5);
    ctx.restore();
  }
}

function loop() {
  step();
  // 物理永不停：完全冻结的图看起来是死的，轻微游走才有生命感。
  // 取景平滑跟随，除非用户自己动过视图。
  if (!userMoved) fit(true);
  draw();
  requestAnimationFrame(loop);
}
function thaw(h) { heat = Math.max(heat, h); }

/* ---------- 交互 ---------- */
function at(mx, my) {
  let best = null, bd = 1e9;
  for (const n of N) {
    const d = Math.hypot(mx - sx(n), my - sy(n));
    if (d < n.r * scale + 11 && d < bd) { bd = d; best = n; }
  }
  return best;
}
let pan = null, moved = false, downAt = null;
const DRAG_PX = 4;   // 小于这个位移仍算点击——手抖和工具点击都会带 1px 移动
cv.addEventListener('mousedown', ev => {
  moved = false; downAt = [ev.clientX, ev.clientY];
  const n = at(ev.clientX, ev.clientY);
  if (n) { dragging = n; thaw(0.5); userMoved = true; }
  else { pan = [ev.clientX - ox, ev.clientY - oy]; cv.classList.add('drag'); }
});
addEventListener('mousemove', ev => {
  if (dragging) {
    if (downAt && Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > DRAG_PX) moved = true;
    dragging.x = (ev.clientX - ox) / scale; dragging.y = (ev.clientY - oy) / scale;
    dragging.vx = 0; dragging.vy = 0; return;
  }
  if (pan) {
    if (downAt && Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > DRAG_PX) {
      moved = true; userMoved = true;
    }
    ox = ev.clientX - pan[0]; oy = ev.clientY - pan[1]; return;
  }
  hover = at(ev.clientX, ev.clientY);
  cv.style.cursor = hover ? 'pointer' : 'grab';
});
addEventListener('mouseup', () => {
  if (pan) cv.classList.remove('drag');
  dragging = null; pan = null;
});
cv.addEventListener('click', ev => {
  if (moved) return;
  const n = at(ev.clientX, ev.clientY);
  if (n) show(n); else hide();
});
cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  const k = Math.exp(-ev.deltaY * 0.0013);
  const ns = Math.max(0.25, Math.min(4, scale * k));
  ox = ev.clientX - (ev.clientX - ox) * (ns / scale);
  oy = ev.clientY - (ev.clientY - oy) * (ns / scale);
  scale = ns; userMoved = true;
}, { passive: false });

const panel = document.getElementById('panel');
function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function show(n) {
  picked = n;
  const links = Array.from(nbr[n.id]);
  let h = '<button class="close" id="x">✕</button>'
    + '<h2>' + esc(n.id) + '</h2>';
  if (n.ghost) {
    h += '<div class="meta">还不存在的片段 · 被 ' + (n.from || []).length + ' 条引用</div>'
      + '<h3>状态</h3><p>有片段用 <code>[[' + esc(n.id) + ']]</code> 指向它，'
      + '但 <code>fragments/' + esc(n.id) + '.md</code> 还没写。'
      + '这不是错误——它记着你已经知道这里该有东西。</p>';
  } else {
    h += '<div class="meta">' + esc(n.cluster) + ' · ' + esc(n.date || '')
      + ' · ' + links.length + ' 条链接</div>'
      + '<h3>钩子</h3><p class="hook">' + esc(n.hook || '（缺 hook 字段）') + '</p>';
  }
  if (n.open.length) {
    h += '<h3>未解决（' + n.open.length + '）</h3><ul>'
      + n.open.map(o => '<li>' + esc(o) + '</li>').join('') + '</ul>';
  }
  if (n.concepts.length) {
    h += '<h3>概念</h3><div class="tags">'
      + n.concepts.map(c => '<span class="tag">' + esc(c) + '</span>').join('') + '</div>';
  }
  if (n.refs.length) {
    h += '<h3>材料</h3><ul>' + n.refs.map(r => '<li>' + esc(r) + '</li>').join('') + '</ul>';
  }
  if (links.length) {
    h += '<h3>' + (n.ghost ? '被这些引用' : '链接到') + '</h3><ul>' + links.map(l =>
      '<li><span class="lnk" data-go="' + esc(l) + '">' + esc(l) + '</span></li>').join('') + '</ul>';
  }
  panel.innerHTML = h;
  panel.hidden = false;
  panel.querySelector('#x').onclick = hide;
  panel.querySelectorAll('[data-go]').forEach(el => {
    el.onclick = () => show(byId[el.dataset.go]);
  });
}
function hide() { picked = null; panel.hidden = true; }

document.getElementById('q').addEventListener('input', e => { query = e.target.value.trim(); });
document.getElementById('fit').onclick = () => { thaw(0.8); userMoved = false; fit(false); };
document.getElementById('theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
};
addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });

/* ---------- 图例 ---------- */
(function () {
  const SC = ['--graph-node-1', '--graph-node-2', '--graph-node-3', '--graph-node-4'];
  let h = DATA.clusters.map(c =>
    '<div class="row"><span class="dot" style="background:var(' + SC[c[2]] + ')"></span>'
    + '<span>' + esc(c[0]) + '</span><span class="n">' + c[1] + '</span></div>').join('');
  h += '<hr><div class="row"><span class="ring"></span><span>有未解决问题</span></div>'
    + '<div class="row"><span class="seg"></span><span>跨簇的桥</span></div>'
    + '<div class="row"><span class="seg" style="border-top-style:solid;border-top-width:3px">'
    + '</span><span>互相引用</span></div>';
  if (N.some(n => n.ghost)) {
    h += '<div class="row"><span class="dot" style="background:'
      + 'var(--graph-node-unresolved);opacity:.55"></span>'
      + '<span>还没写的片段</span></div>';
  }
  if (DATA.clusters.length > 3) {
    h += '<hr><div class="note" title="节点图里任意两簇都可能相邻，适用全配对标准；'
      + '实测第四色相黄↔橙正常视觉 ΔE 13.7 < 15。身份靠节点标签和簇名承载。">'
      + '第 4 个起共用中性灰 ⓘ</div>';
  }
  document.getElementById('legend').innerHTML = h;
})();

addEventListener('resize', () => { resize(); });
resize();
for (let i = 0; i < 280; i++) step();     // 先跑一段，打开时已经成形
fit(false); loop();
setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 6000);
</script></body></html>
